<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Titan AI Robot - Command Center</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f12; color: #e2e8f0; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #left-viewport { width: 60%; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; }
        #right-panel { width: 40%; background: #181820; padding: 25px; display: flex; flex-direction: column; border-left: 2px solid #2d2d3d; box-sizing: border-box; }
        .video-container { background: #000; border-radius: 12px; overflow: hidden; flex-grow: 1; display: flex; align-items: center; justify-content: center; border: 2px solid #3b82f6; min-height: 50vh; }
        .video-container img { width: 100%; height: auto; max-height: 65vh; object-fit: contain; }
        .control-grid { display: grid; grid-template-columns: repeat(3, 1fr); width: 240px; margin: 20px auto; gap: 10px; }
        .btn { padding: 15px; font-weight: bold; font-size: 16px; border: none; border-radius: 8px; background: #3b82f6; color: white; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: #2563eb; }
        .btn-stop { background: #ef4444; }
        .btn-stop:hover { background: #dc2626; }
        #chat-log { flex-grow: 1; background: #0a0a0f; border-radius: 8px; padding: 15px; overflow-y: auto; border: 1px solid #2d2d3d; margin-bottom: 15px; }
        #user-entry { display: flex; gap: 10px; }
        #user-entry input { flex-grow: 1; padding: 12px; border-radius: 6px; border: 1px solid #2d2d3d; background: #0a0a0f; color: white; }
    </style>
</head>
<body>

    <div id="left-viewport">
        <h2>🛰️ Titan AI Robot - Live Vision Matrix</h2>
        <div class="video-container">
            <img id="camera-stream" src="http://192.168.1.50:8080/video" alt="Awaiting live stream feed routing link...">
        </div>
        
        <div class="control-grid">
            <div></div><button class="btn" onclick="sendDrive('F')">▲ FORWARD</button><div></div>
            <button class="btn" onclick="sendDrive('L')">◀ LEFT</button>
            <button class="btn btn-stop" onclick="sendDrive('S')">■ STOP</button>
            <button class="btn" onclick="sendDrive('R')">RIGHT ▶</button>
            <div></div><button class="btn" onclick="sendDrive('B')">▼ BACKWARD</button><div></div>
        </div>
    </div>

    <div id="right-panel">
        <h2>🧠 Onboard Titan AI Core</h2>
        <div id="chat-log">
            <p style="color: #888;">🤖 Assistant initialized. Type your questions in English, हिंदी, or मराठी...</p>
        </div>
        <div id="user-entry">
            <input type="text" id="query" placeholder="Ask technical or structural questions..." onkeypress="if(event.key === 'Enter') submitQuery()">
            <button class="btn" onclick="submitQuery()">Send</button>
        </div>
    </div>

    <script>
        function sendDrive(directionCode) {
            fetch(`/api/drive?cmd=${directionCode}`);
        }

        async function submitQuery() {
            const inputField = document.getElementById('query');
            const chatLog = document.getElementById('chat-log');
            const question = inputField.value.trim();
            if(!question) return;

            chatLog.innerHTML += `<p><strong>You:</strong> ${question}</p>`;
            inputField.value = "";
            chatLog.scrollTop = chatLog.scrollHeight;

            const response = await fetch(`/api/ask-ai?prompt=${encodeURIComponent(question)}`);
            const data = await response.json();
            
            chatLog.innerHTML += `<p style="color: #60a5fa;"><strong>Titan AI:</strong> ${data.reply}</p>`;
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    </script>
</body>
</html>
