<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Command Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #09090e; color: #fff; margin: 0; padding: 20px; }
        .logo-container { margin: 15px auto; font-weight: bold; font-size: 32px; letter-spacing: 4px; color: #00ffcc; text-shadow: 0 0 12px rgba(0, 255, 204, 0.6); display: flex; align-items: center; justify-content: center; gap: 12px; }
        .logo-img { height: 45px; width: auto; filter: drop-shadow(0 0 8px rgba(0, 255, 204, 0.6)); }
        .panel { max-width: 900px; margin: 0 auto; background: #13131a; padding: 25px; border-radius: 16px; border: 1px solid #222; display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .left-column, .right-column { flex: 1; min-width: 300px; max-width: 440px; }
        .video-box { width: 100%; height: 320px; background: #000; border: 3px solid #00ffcc; border-radius: 8px; position: relative; display: flex; align-items: center; justify-content: center; color: #00ffcc; font-weight: bold; font-size: 14px; }
        .chat-box { width: 100%; height: 320px; background: #1a1a26; border: 1px solid #333; border-radius: 8px; display: flex; flex-direction: column; text-align: left; }
        .chat-logs { flex: 1; padding: 15px; overflow-y: auto; font-size: 14px; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 85%; }
        .msg.user { background: #007bff; color: white; margin-left: auto; }
        .msg.titan { background: #222; color: #00ffcc; border: 1px solid #333; }
        .btn { padding: 14px 24px; font-size: 15px; margin: 5px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .drive-btn { background-color: #007bff; color: white; }
        .stop-btn { background-color: #dc3545; color: white; width: 120px; }
        #status-display { width: 100%; margin: 10px 0 20px 0; color: #ffcc00; font-size: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="static/favicon.png" class="logo-img" alt="Logo" onerror="this.style.display='none';">
        <span>MD</span>
    </div>

    <div id="status-display">SYSTEM STANDING BY...</div>

    <div class="panel">
        <div class="left-column">
            <h3 style="color: #00ffcc; margin-top:0;">🎥 REMOTE ROBOT VIEWPORT</h3>
            <div class="video-box" id="viewport-frame">
                [ ROBOT NETWORK RECEIVER SYNCED ]
            </div>
            
            <div style="margin-top: 20px;">
                <button class="btn drive-btn" onclick="sendOverride('forward')">FORWARD</button><br>
                <button class="btn drive-btn" onclick="sendOverride('left')">LEFT</button>
                <button class="btn stop-btn" onclick="sendOverride('stop')">STOP</button>
                <button class="btn drive-btn" onclick="sendOverride('right')">RIGHT</button><br>
                <button class="btn drive-btn" onclick="sendOverride('backward')">BACKWARD</button>
            </div>
        </div>

        <div class="right-column">
            <h3 style="color: #00ffcc; margin-top:0;">💬 TITAN COMMAND BOX</h3>
            <div class="chat-box">
                <div class="chat-logs" id="chat-scroller">
                    <div class="msg titan">Awaiting remote network node pairing parameters...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // EDIT THIS IP WHEN YOU CHANGE NETWORKS (e.g., at college / hotspot)
        const esp32IP = "http://192.168.0.125";
        
        const chatScroller = document.getElementById("chat-scroller");
        const statusText = document.getElementById("status-display");
        const viewportFrame = document.getElementById("viewport-frame");

        const syncChannel = new BroadcastChannel('titan_telemetry_stream');
        
        syncChannel.onmessage = function(event) {
            if (event.data.type === 'log') {
                appendToChatLogs(event.data.sender, event.data.text);
                statusText.innerText = "MD ROBOTICS & INVENTIONS | 🤖 TITAN VOICE CORE ACTIVE...";
            } else if (event.data.type === 'stream_active') {
                viewportFrame.innerText = "🎥 LIVE TELEMETRY STREAM FEED BALANCED";
                viewportFrame.style.color = "#00ffcc";
            }
        };

        function appendToChatLogs(sender, text) {
            const messageDiv = document.createElement("div");
            messageDiv.classList.add("msg", sender);
            messageDiv.innerText = text;
            chatScroller.appendChild(messageDiv);
            chatScroller.scrollTop = chatScroller.scrollHeight;
        }

        function sendOverride(endpoint) {
            statusText.innerText = "MANUAL OVERRIDE ROUTE SIGNALS SENT: " + endpoint.toUpperCase();
            fetch(`${esp32IP}/${endpoint}`).catch(() => {});
        }
    </script>
</body>
</html>
