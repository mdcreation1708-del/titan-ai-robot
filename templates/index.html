<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN AI - Main Control Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: Arial, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; user-select: none; }
        .panel { background: #161b22; border: 2px solid #00e5ff; border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 0 15px rgba(0, 229, 255, 0.1); width: 90%; max-width: 960px; margin-bottom: 20px; position: relative; }
        .header-container { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #00e5ff; }
        .badge { background: transparent; border: 2px solid #00e5ff; color: #00e5ff; padding: 2px 10px; border-radius: 6px; font-size: 1rem; font-weight: bold; font-family: monospace; }
        .subtext { color: #8b949e; font-size: 0.95rem; letter-spacing: 1px; margin: 5px 0 0 0; font-family: monospace; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 90%; max-width: 1000px; }
        h2 { color: #00e5ff; margin-top: 0; font-size: 1.3rem; letter-spacing: 1px; }
        .stream-window { width: 100%; height: 240px; background: #000; border-radius: 8px; border: 1px dashed #00e5ff; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        .control-pad { display: grid; grid-template-columns: repeat(3, 75px); gap: 12px; justify-content: center; margin: 20px 0; }
        .btn { background: #21262d; border: 1px solid #00e5ff; color: #00e5ff; padding: 18px; border-radius: 10px; font-weight: bold; font-size: 1.2rem; cursor: pointer; transition: 0.1s; touch-action: manipulation; }
        .btn:active, .btn.active { background: #00e5ff; color: #000; box-shadow: 0 0 15px #00e5ff; }
        .btn-empty { border: none; background: transparent; }
        .chat-area { height: 140px; background: #0d1117; border-radius: 6px; border: 1px solid #30363d; overflow-y: auto; padding: 10px; text-align: left; font-size: 0.9rem; }
        .chat-input-row { display: flex; gap: 10px; margin-top: 10px; }
        .chat-input { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 10px; border-radius: 6px; }
        .nav-link { color: #00e5ff; text-decoration: none; font-family: monospace; font-weight: bold; font-size: 0.95rem; }
        .nav-link:hover { text-decoration: underline; }
        .stop-speech-btn { background: #ff0055; color: #fff; border: none; padding: 8px 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 8px; width: 100%; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="header-container">
            <img src="/favicon.ico" class="logo-img" alt="Logo">
            <h1 style="color:#00e5ff; margin:0; font-size:1.8rem; letter-spacing:2px;">TITAN CENTRAL COMMAND</h1>
            <span class="badge">MD</span>
        </div>
        <div class="subtext">TiTaN Labs Of iNNvovention</div>
        <p style="margin:12px 0 0 0; color:#8b949e; font-size: 0.9rem;" id="net-status">
            <span style="color:#ffaa00;">●</span> Connecting Core Hub...
        </p>
        
        <div style="margin-top: 15px; border-top: 1px solid #30363d; padding-top: 12px; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; align-items: center;">
            <a href="/robot" target="_blank" class="nav-link" style="color:#00e5ff;">🔗 LAUNCH PHONE ROBOT NODE →</a>
            <a href="/api/cmd" target="_blank" class="nav-link" style="color:#39ff14;">⚡ API CMD ENDPOINT →</a>
        </div>
    </div>

    <div class="grid-container">
        <div class="panel" style="width: auto; margin-bottom: 0;">
            <h2>LIVE VIDEO STREAM</h2>
            <div class="stream-window">
                <video id="remoteVideo" autoplay playsinline muted controls></video>
            </div>
            
            <h2>TOUCH DRIVE (HOLD TO MOVE)</h2>
            <div class="control-pad">
                <button class="btn-empty"></button>
                <button class="btn" id="btn-fwd">▲</button>
                <button class="btn-empty"></button>
                <button class="btn" id="btn-left">◀</button>
                <button class="btn" id="btn-stop" style="border-color:#ff5555; color:#ff5555;">■</button>
                <button class="btn" id="btn-right">▶</button>
                <button class="btn-empty"></button>
                <button class="btn" id="btn-rev">▼</button>
                <button class="btn-empty"></button>
            </div>
        </div>

        <div class="panel" style="width: auto; margin-bottom: 0; display:flex; flex-direction:column; justify-content:space-between;">
            <div>
                <h2>MANUAL AI TERMINAL</h2>
                <div class="chat-area" id="terminal-logs">
                    <div style="color:#8b949e;">[System Initialization Complete] Console Ready...</div>
                </div>
                <button class="stop-speech-btn" onclick="triggerStopSpeech()">🛑 MUTE / STOP TITAN SPEECH</button>
            </div>
            
            <div class="chat-input-row">
                <input type="text" class="chat-input" id="user-msg" placeholder="Type instructions here..." onkeydown="if(event.key==='Enter') sendManualMessage()">
                <button class="btn" style="padding:10px 20px;" onclick="sendManualMessage()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        const logs = document.getElementById('terminal-logs');
        let ws; let peerConnection;
        let activeDirection = "STOP";
        let isKeyPressed = false;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + window.location.host + '/core');

            ws.onopen = () => {
                ws.send(JSON.stringify({ register: 'deck' }));
                document.getElementById('net-status').innerHTML = '<span style="color:#39ff14;">●</span> Render Core Linked';
                
                setInterval(() => {
                    if(ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping_esp' }));
                    }
                }, 10000);

                startVideoCall();
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data); 
                
                if (data.type === 'ai_reply') {
                    logs.innerHTML += `<div style="color:#39ff14; margin-bottom:8px;"><strong>TiTaN:</strong> ${data.payload}</div>`;
                    logs.scrollTop = logs.scrollHeight;
                } else if (data.type === 'sdp' && data.sdp.type === 'answer') {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                } else if (data.type === 'candidate') {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
                }
            };

            ws.onclose = () => {
                document.getElementById('net-status').innerHTML = '<span style="color:#ffaa00;">●</span> Reconnecting...';
                setTimeout(initWebSocket, 2000);
            };
        }

        async function startVideoCall() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            peerConnection.ontrack = (event) => { 
                const remoteVid = document.getElementById('remoteVideo');
                remoteVid.srcObject = event.streams[0];
                remoteVid.play().catch(err => console.log("Auto-play wait:", err));
            };
            peerConnection.onicecandidate = (e) => {
                if (e.candidate && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
                }
            };
            peerConnection.addTransceiver('video', { direction: 'recvonly' });
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            ws.send(JSON.stringify({ type: 'sdp', sdp: offer }));
        }

        async function sendCommand(dir) {
            if (activeDirection === dir) return;
            activeDirection = dir;

            logs.innerHTML += `<div style="color:#00e5ff;">&gt; Instruction: ${dir}</div>`;
            logs.scrollTop = logs.scrollHeight;

            try {
                await fetch('/api/cmd', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: dir })
                });
            } catch(e){}

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'movement', payload: dir }));
            }
        }

        function attachHoldControls(elementId, direction) {
            const btn = document.getElementById(elementId);
            
            const startDrive = (e) => {
                e.preventDefault();
                btn.classList.add('active');
                sendCommand(direction);
            };

            const stopDrive = (e) => {
                e.preventDefault();
                btn.classList.remove('active');
                sendCommand('STOP');
            };

            btn.addEventListener('mousedown', startDrive);
            btn.addEventListener('mouseup', stopDrive);
            btn.addEventListener('mouseleave', stopDrive);

            btn.addEventListener('touchstart', startDrive);
            btn.addEventListener('touchend', stopDrive);
            btn.addEventListener('touchcancel', stopDrive);
        }

        attachHoldControls('btn-fwd', 'FORWARD');
        attachHoldControls('btn-rev', 'REVERSE');
        attachHoldControls('btn-left', 'LEFT');
        attachHoldControls('btn-right', 'RIGHT');
        document.getElementById('btn-stop').onclick = () => sendCommand('STOP');

        document.addEventListener('keydown', (e) => {
            if (document.activeElement === document.getElementById('user-msg')) return;
            if (isKeyPressed) return;
            isKeyPressed = true;

            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') sendCommand('FORWARD');
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') sendCommand('REVERSE');
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') sendCommand('LEFT');
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') sendCommand('RIGHT');
            if (e.key === ' ') sendCommand('STOP');
        });

        document.addEventListener('keyup', (e) => {
            if (document.activeElement === document.getElementById('user-msg')) return;
            isKeyPressed = false;
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','s','S','a','A','d','D'].includes(e.key)) {
                sendCommand('STOP');
            }
        });

        function sendManualMessage() {
            const input = document.getElementById('user-msg');
            if(!input.value.trim()) return;
            logs.innerHTML += `<div style="color:#fff;">&gt; Operator: ${input.value}</div>`;
            logs.scrollTop = logs.scrollHeight;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'question', payload: input.value }));
            }
            input.value = '';
        }

        function triggerStopSpeech() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'stop_speech' }));
            }
        }

        window.onload = () => { initWebSocket(); };
    </script>
</body>
</html>
