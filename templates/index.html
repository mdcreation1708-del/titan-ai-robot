<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN AI ROBOT CONTROL CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #09090b; color: #fafafa; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <header class="flex justify-between items-center border-b border-zinc-800 pb-4">
            <div class="flex items-center space-x-3">
                <h1 class="text-2xl font-black tracking-wider text-emerald-400">TITAN AI ROBOT</h1>
            </div>
            <span class="bg-emerald-950/30 border border-emerald-800 text-emerald-400 px-4 py-1.5 rounded-full text-xs font-semibold tracking-wide shadow-lg shadow-emerald-950/20">
                🌐 Telemetry Cloud Linked
            </span>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <div class="bg-zinc-950 p-5 rounded-2xl border border-zinc-900 shadow-xl space-y-4">
                <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                    <h2 class="text-sm font-bold tracking-widest uppercase text-zinc-400">Live Recon Feed</h2>
                </div>
                <div class="relative overflow-hidden rounded-xl border border-zinc-850 aspect-video bg-black">
                    <img src="http://192.168.31.142:8080/video" class="w-full h-full object-cover" alt="Titan Visual Pipeline Streaming">
                </div>
            </div>

            <div class="bg-zinc-950 p-6 rounded-2xl border border-zinc-900 shadow-xl flex flex-col justify-between space-y-8">
                <div>
                    <h2 class="text-sm font-bold tracking-widest uppercase text-zinc-400 mb-6">Tactical Navigation</h2>
                    
                    <div class="grid grid-cols-3 gap-4 max-w-[280px] mx-auto">
                        <div></div>
                        <button onclick="sendVector('forward')" class="bg-zinc-900 border border-zinc-800 p-5 rounded-xl text-xl font-bold hover:bg-zinc-800 hover:border-zinc-700 active:scale-95 transition-all duration-150">▲</button>
                        <div></div>
                        
                        <button onclick="sendVector('left')" class="bg-zinc-900 border border-zinc-800 p-5 rounded-xl text-xl font-bold hover:bg-zinc-800 hover:border-zinc-700 active:scale-95 transition-all duration-150">◀</button>
                        <button onclick="sendVector('stop')" class="bg-red-950/40 border border-red-900 text-red-400 p-5 rounded-xl text-xl font-bold hover:bg-red-900/40 active:scale-95 transition-all duration-150">■</button>
                        <button onclick="sendVector('right')" class="bg-zinc-900 border border-zinc-800 p-5 rounded-xl text-xl font-bold hover:bg-zinc-800 hover:border-zinc-700 active:scale-95 transition-all duration-150">▶</button>
                        
                        <div></div>
                        <button onclick="sendVector('backward')" class="bg-zinc-900 border border-zinc-800 p-5 rounded-xl text-xl font-bold hover:bg-zinc-800 hover:border-zinc-700 active:scale-95 transition-all duration-150">▼</button>
                        <div></div>
                    </div>
                </div>

                <div class="pt-4 border-t border-zinc-900">
                    <button onclick="reengageAuto()" class="w-full bg-emerald-950/40 border border-emerald-900 text-emerald-400 py-4 rounded-xl font-bold text-sm tracking-widest uppercase hover:bg-emerald-900/40 active:scale-[0.99] transition-all duration-150 shadow-lg shadow-emerald-950/10">
                        Re-Engage Autonomous Mode
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function sendVector(action) {
            console.log("[Manual Trigger] Vector Dispatched: " + action);
            fetch('/' + action)
                .then(response => response.json())
                .then(data => console.log("[Backend Response Received]:", data))
                .catch(err => console.error("Signal Routing Failure:", err));
        }

        function reengageAuto() {
            console.log("[Mode Selector] Initializing Automation Loop Handshake...");
            fetch('/reset_auto')
                .then(response => response.json())
                .then(data => console.log("[Automation Response]:", data))
                .catch(err => console.error("Automation Handshake Failure:", err));
        }
    </script>
</body>
</html>
