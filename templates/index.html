<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiTaN Ai RoBoT - Control Center</title>
    
    <link rel="icon" type="image/png" href="favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Urbanist:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-color: #060606;
            --card-bg: #0f0f0f;
            --accent-color: #deff9a;
            --text-color: #f5f5f5;
            --text-muted: #a0a0a0;
            --border-color: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Urbanist', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px; /* Spacing between logo and text */
        }

        /* 🎯 Styles the logo before the title */
        .header-logo {
            width: 42px;
            height: 42px;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid rgba(222, 255, 154, 0.2);
        }

        .logo-section h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .logo-section h1 span {
            color: var(--accent-color);
        }

        .status-badge {
            background-color: rgba(222, 255, 154, 0.1);
            color: var(--accent-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid rgba(222, 255, 154, 0.2);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            flex-grow: 1;
        }

        /* Video Feed Box */
        .feed-container {
            background-color: #000;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 500px;
            position: relative;
        }

        .feed-header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2;
        }

        .feed-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #ff4a4a;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        .video-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505;
        }

        .video-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Control Panel Box */
        .control-panel {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .panel-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .joystick-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .drive-btn {
            background-color: #141414;
            border: 1px solid #222;
            color: var(--text-color);
            border-radius: 12px;
            height: 80px;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }

        .drive-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background-color: rgba(222, 255, 154, 0.02);
        }

        .drive-btn:active {
            background-color: var(--accent-color);
            color: #000;
            transform: scale(0.95);
        }

        .stop-btn {
            background-color: #241010;
            border-color: #3d1414;
            color: #ff6b6b;
        }

        .stop-btn:hover {
            background-color: #3d1414;
            color: #ff8e8e;
            border-color: #ff6b6b;
        }

        .stop-btn:active {
            background-color: #ff6b6b;
            color: #000;
        }

        .empty-slot {
            visibility: hidden;
        }

        footer {
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 14px;
            text-align: center;
            width: 100%;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .feed-container {
                height: 350px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <img src="favicon.png" alt="TiTaN Core Logo" class="header-logo">
            <h1>TiTaN <span>Ai RoBoT</span></h1>
        </div>
        <div class="status-badge">
            <i class="fa-solid fa-satellite-dish"></i> Telemetry Cloud Linked
        </div>
    </header>

    <main class="main-layout">
        <section class="feed-container">
            <div class="feed-header">
                <div class="pulse-dot"></div>
                <h2>Live Recon Feed</h2>
            </div>
            <div class="video-wrapper">
                <img id="camera-stream" src="http://YOUR_ESP32_IP/video" alt="Robot Feed Awaiting Connection Pipeline">
            </div>
        </section>

        <section class="control-panel">
            <div>
                <h3 class="panel-title">Tactical Navigation</h3>
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px;">
                    Commands route directly via secure tunnels to edge-logic pins.
                </p>
                
                <div class="joystick-grid">
                    <div class="empty-slot"></div>
                    <button class="drive-btn" onclick="sendDrive('F')"><i class="fa-solid fa-chevron-up"></i></button>
                    <div class="empty-slot"></div>

                    <button class="drive-btn" onclick="sendDrive('L')"><i class="fa-solid fa-chevron-left"></i></button>
                    <button class="drive-btn stop-btn" onclick="sendDrive('S')"><i class="fa-solid fa-hand"></i></button>
                    <button class="drive-btn" onclick="sendDrive('R')"><i class="fa-solid fa-chevron-right"></i></button>

                    <div class="empty-slot"></div>
                    <button class="drive-btn" onclick="sendDrive('B')"><i class="fa-solid fa-chevron-down"></i></button>
                    <div class="empty-slot"></div>
                </div>
            </div>

            <div style="margin-top: 30px; font-size: 13px; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border-color); padding-top: 15px;">
                <i class="fa-solid fa-microchip"></i> System Core: ESP32 WROOM-32
            </div>
        </section>
    </main>

    <footer>
        &copy; 2026 TiTaN AI Robotics Automation System
    </footer>

    <script>
        function sendDrive(directionCode) {
            const directions = { 
                'F': 'forward', 
                'B': 'backward', 
                'L': 'left', 
                'R': 'right', 
                'S': 'stop' 
            };
            
            console.log(`Sending Actuation Vector: ${directions[directionCode]}`);
            
            // NOTE: Replace YOUR_ESP32_IP with the same IP address for direct routing
            fetch(`http://YOUR_ESP32_IP/${directions[directionCode]}`)
                .then(response => console.log(`Hardware Response acknowledged.`))
                .catch(err => console.error(`Signal delivery failure:`, err));
        }
    </script>
</body>
</html>
