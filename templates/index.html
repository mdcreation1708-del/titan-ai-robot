<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN AI - Main Dashboard</title>
    <!-- Favicon pulling from your static folder -->
    <link rel="icon" type="image/png" href="static/logo.png">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-header {
            margin-top: 20px;
            text-align: center;
        }
        .logo-header img {
            height: 80px;
            width: auto;
        }
        .panel {
            background: #161b22;
            border: 2px solid #00e5ff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            border-radius: 12px;
            padding: 30px;
            width: 80%;
            max-width: 800px;
            text-align: center;
            margin-top: 20px;
        }
        h1 { color: #00e5ff; margin-bottom: 5px; letter-spacing: 2px; }
        p { color: #8b949e; }
        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #39ff14;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #39ff14;
        }
    </style>
</head>
<body>

    <!-- Logo displayed on the main panel pulling from your static directory -->
    <div class="logo-header">
        <img src="static/logo.png" alt="Titan AI / MD Creations Logo">
    </div>

    <div class="panel">
        <h1>TITAN MAIN DASHBOARD</h1>
        <p><span class="status-dot"></span> System Core: Operational</p>
        <hr style="border-color: #21262d;">
        <p>Telemetry stream ready. Awaiting remote node input...</p>
    </div>

</body>
</html>
