<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titania AI Robot Master Control</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #09090e; 
            color: #ffffff; 
            margin: 0;
            padding: 20px; 
        }
        h1 { color: #00ffcc; letter-spacing: 2px; font-size: 26px; margin-bottom: 5px; }
        .panel { 
            max-width: 600px; 
            margin: 0 auto; 
            background: #13131a; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #222;
        }
        .video-box { 
            width: 100%; 
            max-width: 480px; 
            height: 360px; 
            background: #000; 
            margin: 15px auto; 
            border: 3px solid #00ffcc; 
            border-radius: 8px; 
            overflow: hidden; 
        }
        /* Style for the native camera video element */
        #camera-stream { width: 100%; height: 100%; object-fit: cover; }
        .btn { 
            padding: 14px 28px; 
            font-size: 16px; 
            margin: 6px; 
            cursor: pointer; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            transition: 0.2s;
        }
        .drive-btn { background-color: #007bff; color: white; }
        .stop-btn { background-color: #dc3545; color: white; width: 100px; }
        #status-display { margin: 15px 0; color: #00ffcc; font-size: 16px; font-weight: bold; }
        .boot-prompt { color: #ffcc00; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>TITANIA AI ROBOT CORE</h1>
        <div id="status-display" class="boot-prompt">TAP ANYWHERE ON SCREEN TO BOOT TITAN INTERFACE</div>
        
        <div class="video-box">
            <video id="camera-stream" autoplay playsinline muted></video>
        </div>

        <hr style="border-color: #2a2a3a; margin: 20px 0;">

        <div>
            <button class="btn drive-btn" onclick="triggerCommand('forward')">FORWARD</button><br>
            <button class="btn drive-btn" onclick="triggerCommand('left')">LEFT</button>
            <button class="btn stop-btn" onclick="triggerCommand('stop')">STOP</button>
            <button class="btn drive-btn" onclick="triggerCommand('right')">RIGHT</button><br>
            <button class="btn drive-btn" onclick="triggerCommand('backward')">BACKWARD</button>
        </div>
    </div>

    <script>
        // ⚙️ Change this IP to match your current ESP32 address when it connects to ATUL
        const esp32IP = "http://192.168.0.125"; 
        const statusText = document.getElementById("status-display");
        const videoElement = document.getElementById("camera-stream");
        
        let recognition;
        let isSpeaking = false;
        let systemBooted = false;

        // 🔊 1. BROWSER SPEAKER AUDIO OUTPUT ENGINE
        function speakVocalOutput(phrase) {
            if ('speechSynthesis' in window) {
                isSpeaking = true;
                if(recognition) recognition.stop(); // Pause mic loop while talking to avoid self-echo

                const speechPacket = new SpeechSynthesisUtterance(phrase);
                speechPacket.rate = 1.0;  
                speechPacket.pitch = 0.9; 
                speechPacket.lang = 'en-US';

                speechPacket.onend = function() {
                    isSpeaking = false;
                    startTitanAutonomousListening(); // Resume listening when done talking
                };

                window.speechSynthesis.speak(speechPacket);
            }
        }

        // 📡 2. LOCAL NETWORK WI-FI COMMAND TRANSMITTER
        function triggerCommand(routeEndpoint) {
            statusText.innerText = "Executing Path: " + routeEndpoint;
            
            if(["forward", "backward", "left", "right"].includes(routeEndpoint)) {
                speakVocalOutput("Moving Boss!");
            } else if (routeEndpoint === "stop") {
                speakVocalOutput("Stopping.");
            }

            // Hits your ESP32 local server endpoints directly
            fetch(`${esp32IP}/${routeEndpoint}`)
                .then(response => response.json())
                .then(data => { console.log("ESP32 Feedback:", data.status); })
                .catch(error => { console.error("Chassis communications link timed out:", error); });
        }

        // 🎙️ 3. AUTONOMOUS WAKE-WORD LISTENING ENGINE ("Hey Titan")
        function startTitanAutonomousListening() {
            if (isSpeaking) return; 

            const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
            if (!SpeechRecognition) {
                statusText.innerText = "Voice engine not supported on this browser context.";
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            statusText.innerText = "🤖 Titan Active | Listening for 'Hey Titan'...";

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript.toLowerCase();
                statusText.innerText = `Heard phrase: "${speechToText}"`;
                
                // Wake word gateway check
                if (speechToText.includes("titan") || speechToText.includes("hey titan") || speechToText.includes("tighten")) {
                    
                    if (speechToText.includes("how") || speechToText.includes("status") || speechToText.includes("find") || speechToText.includes("que")) {
                        speakVocalOutput("Okay Boss, Finding.");
                    } else if (speechToText.includes("forward") || speechToText.includes("go") || speechToText.includes("move")) {
                        triggerCommand("forward");
                    } else if (speechToText.includes("backward") || speechToText.includes("reverse") || speechToText.includes("back")) {
                        triggerCommand("backward");
                    } else if (speechToText.includes("left")) {
                        triggerCommand("left");
                    } else if (speechToText.includes("right")) {
                        triggerCommand("right");
                    } else if (speechToText.includes("stop") || speechToText.includes("wait")) {
                        triggerCommand("stop");
                    } else {
                        speakVocalOutput("I am listening, Boss.");
                    }
                }
            };

            // Keep the microphone loop running infinitely
            recognition.onend = function() {
                if (!isSpeaking) recognition.start();
            };

            recognition.onerror = function(event) {
                if (event.error === 'no-speech') return; // Ignore room background silence drops
                console.log("Mic loop trace: ", event.error);
            };

            try { recognition.start(); } catch(e) {}
        }

        // ⚡ 4. UNIFIED SINGLE-PHONE SYSTEM ACTIVATOR
        function bootSinglePhoneSystem() {
            if (systemBooted) return;
            systemBooted = true;
            statusText.innerText = "Booting hardware arrays...";

            // Access the phone's back camera natively inside the webpage layout
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
                .then(function(cameraStream) {
                    videoElement.srcObject = cameraStream;
                    videoElement.play();
                    
                    statusText.innerText = "Camera synchronized. Initializing vocal matrix...";
                    
                    // Fire welcome audio and start background wake-word listening loop
                    speakVocalOutput("Autonomous systems online. Hello M D sir. Titan is ready.");
                    startTitanAutonomousListening();
                })
                .catch(function(error) {
                    statusText.innerText = "Camera access denied or blocked.";
                    console.error("Lens deployment error: ", error);
                    // Fallback to active microphone loops even if the video system fails
                    startTitanAutonomousListening();
                });
        }

        // Boots the entire ecosystem on your very first screen tap
        window.onclick = function() {
            bootSinglePhoneSystem();
        };
    </script>
</body>
</html>
