<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN AI - Phone Robot Node</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: Arial, sans-serif; margin: 0; padding: 20px; text-align: center; }
        .panel { background: #161b22; border: 2px solid #39ff14; border-radius: 12px; padding: 20px; max-width: 500px; margin: auto; }
        .stream-window { width: 100%; height: 300px; background: #000; border-radius: 8px; border: 1px solid #39ff14; overflow: hidden; margin-top: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .status { color: #39ff14; font-family: monospace; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="panel">
        <h1 style="color:#39ff14; margin:0; font-size:1.5rem;">ROBOT NODE VISION & VOICE</h1>
        <p class="status" id="node-status">INITIALIZING CAMERA...</p>

        <div class="stream-window">
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div style="margin-top: 20px;">
            <a href="/" style="color:#00e5ff; font-family:monospace; text-decoration:none; font-weight:bold;">← RETURN TO MAIN DASHBOARD</a>
        </div>
    </div>

    <script>
        let ws; let peerConnection; let localStream;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('node-status').innerText = "CAMERA ACTIVE - LINKING CORE...";
                initWebSocket();
            } catch (err) {
                document.getElementById('node-status').style.color = "#ff5555";
                document.getElementById('node-status').innerText = "CAMERA ACCESS DENIED / NOT FOUND";
            }
        }

        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + window.location.host + '/core');

            ws.onopen = () => {
                ws.send(JSON.stringify({ register: 'robot' }));
                document.getElementById('node-status').innerText = "CONNECTED TO RENDER CORE";

                setInterval(() => {
                    if(ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping_esp' }));
                    }
                }, 10000);
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'sdp' && data.sdp.type === 'offer') {
                    peerConnection = new RTCPeerConnection(rtcConfig);
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

                    peerConnection.onicecandidate = (e) => {
                        if (e.candidate && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
                        }
                    };

                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    ws.send(JSON.stringify({ type: 'sdp', sdp: answer }));
                } else if (data.type === 'candidate' && peerConnection) {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
                } else if (data.type === 'ai_reply') {
                    speakText(data.payload);
                } else if (data.type === 'stop_speech') {
                    window.speechSynthesis.cancel();
                }
            };

            ws.onclose = () => {
                document.getElementById('node-status').innerText = "RECONNECTING TO CORE...";
                setTimeout(initWebSocket, 2000);
            };
        }

        function speakText(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        window.onload = () => { initCamera(); };
    </script>
</body>
</html>
