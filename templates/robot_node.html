<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiTaN - Robot Operations Node</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #00e5ff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 1.8rem; letter-spacing: 2px; color: #00e5ff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.4); }
        .container { width: 100%; max-width: 480px; background: #131b2e; border: 1px solid #1f2d4a; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 20px; }
        .video-box { width: 100%; height: 240px; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #24345c; display: flex; align-items: center; justify-content: center; }
        .video-box img { width: 100%; height: 100%; object-fit: cover; }
        .video-placeholder { color: #4a5c80; font-size: 0.9rem; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .status-card { background: #1a253f; padding: 10px; border-radius: 6px; border-left: 4px solid #00e5ff; font-size: 0.8rem; }
        .status-card span { display: block; color: #8a99ad; margin-bottom: 4px; }
        .status-card strong { color: #fff; font-size: 0.95rem; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        #boot-btn { background-color: #00e5ff; color: #0b0f19; }
        #boot-btn.active { background-color: #ff3366; color: #fff; }
        .log-box { background: #080c14; border: 1px solid #1a253f; border-radius: 6px; padding: 10px; height: 100px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; color: #00ffcc; }
    </style>
</head>
<body>
    <header>
        <h1>TiTaN // NODE</h1>
    </header>
    <div class="container">
        <div class="video-box" id="video-container">
            <div class="video-placeholder">Camera Feed Offline</div>
        </div>
        <div class="status-grid">
            <div class="status-card"><span>Motor</span><strong id="telemetry-cmd">STOP</strong></div>
            <div class="status-card"><span>Audio</span><strong id="telemetry-audio">Standby</strong></div>
        </div>
        <button id="boot-btn" onclick="toggleSystem()">Boot System & Mic</button>
        <div class="log-box" id="console-logs">[System]: Initialized.<br></div>
    </div>

    <script>
        let active = false;
        let isMicEnabled = false;
        let isSpeaking = false;
        let recognition = null;
        let currentAudio = null;

        function printLog(text, color = "#00ffcc") {
            const box = document.getElementById('console-logs');
            box.innerHTML += `<span style="color: ${color}">[${new Date().toLocaleTimeString()}] ${text}</span><br>`;
            box.scrollTop = box.scrollHeight;
        }

        function toggleSystem() {
            active = !active;
            const btn = document.getElementById('boot-btn');
            if (active) {
                btn.classList.add('active');
                btn.innerText = "Shutdown System";
                isMicEnabled = true;
                printLog("System active.");
                document.getElementById('video-container').innerHTML = `<img src="/video_stream" alt="Feed">`;
                initVoiceEngine();
                startListening();
            } else {
                btn.classList.remove('active');
                btn.innerText = "Boot System & Mic";
                isMicEnabled = false;
                if (recognition) recognition.stop();
                if (currentAudio) currentAudio.pause();
                document.getElementById('video-container').innerHTML = `<div class="video-placeholder">Offline</div>`;
                printLog("System shutdown.", "#ff5555");
            }
        }

        async function robotSpeak(textToSay) {
            if (!textToSay) return;
            if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }

            try {
                const response = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textToSay })
                });
                if (!response.ok) throw new Error("TTS failed");
                const blob = await response.blob();
                currentAudio = new Audio(URL.createObjectURL(blob));
                currentAudio.play();
                isSpeaking = true;
                currentAudio.onended = () => {
                    isSpeaking = false;
                    if (active && isMicEnabled) setTimeout(startListening, 300);
                };
            } catch (e) {
                printLog("Voice error.", "#ff5555");
                isSpeaking = false;
            }
        }

        function initVoiceEngine() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) return;
            recognition = new window.SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'mr-IN';

            recognition.onresult = async (event) => {
                const speech = event.results[0][0].transcript.trim().toLowerCase();
                printLog(`Heard: "${speech}"`, "#fff");

                if (speech.includes("forward") || speech.includes("पुढे")) {
                    await fetch('/api/cmd', { method: 'POST', body: JSON.stringify({ command: 'FORWARD' }), headers: {'Content-Type':'application/json'}});
                    robotSpeak("Moving forward.");
                    return;
                }
                if (speech.includes("stop") || speech.includes("थांब")) {
                    await fetch('/api/cmd', { method: 'POST', body: JSON.stringify({ command: 'STOP' }), headers: {'Content-Type':'application/json'}});
                    robotSpeak("Stopping.");
                    return;
                }

                if (speech.length > 2) {
                    printLog("Searching web & AI...", "#ffcc00");
                    try {
                        const res = await fetch('/api/ask_ai', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ query: speech })
                        });
                        const data = await res.json();
                        if (data.reply) robotSpeak(data.reply);
                    } catch (e) {
                        robotSpeak("Error processing query.");
                    }
                }
            };

            recognition.onend = () => {
                if (active && isMicEnabled && !isSpeaking) setTimeout(startListening, 400);
            };
        }

        function startListening() {
            if (!active || !isMicEnabled || isSpeaking) return;
            try { recognition.start(); } catch (e) {}
        }
    </script>
</body>
</html>
