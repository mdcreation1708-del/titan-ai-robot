<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN AI - Robot Node</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body { background-color: #0b0e14; color: #c9d1d9; font-family: Arial, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .robot-box { border: 2px solid #39ff14; background: #101520; border-radius: 12px; padding: 25px; text-align: center; width: 90%; max-width: 480px; }
        .header-container { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .badge { border: 2px solid #39ff14; color: #39ff14; padding: 1px 8px; border-radius: 5px; font-family: monospace; font-weight: bold; }
        .video-preview { width: 100%; height: 180px; background: #000; border-radius: 6px; margin-top: 15px; overflow: hidden; border: 1px solid #39ff14; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .action-btn { background: #101520; border: 2px solid #39ff14; color: #39ff14; padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        .action-btn:hover { background: #39ff14; color: #000; }
        .stop-btn { background: #ff0055; border: none; color: #fff; padding: 10px 20px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; }
        .log-box { background: #070a0f; border: 1px solid #30363d; height: 160px; border-radius: 6px; margin-top: 15px; padding: 10px; overflow-y: auto; text-align: left; font-family: monospace; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="robot-box">
        <div class="header-container">
            <h1 style="color:#39ff14; margin:0; font-size:1.6rem;">TITAN CORE NODE</h1>
            <span class="badge">MD</span>
        </div>
        <div style="margin-top: 5px;">STATUS: <span id="status-text" style="color:#ffaa00;">OFFLINE</span></div>
        <div class="video-preview">
            <video id="localVideo" autoplay muted playsinline></video>
            <canvas id="captureCanvas" style="display:none;"></canvas>
        </div>
        <button class="action-btn" id="act-btn" onclick="bootRobotHead()">BOOT SYSTEM</button>
        <button class="stop-btn" onclick="stopRobotSpeechDirectly()">🛑 STOP SPEAKING</button>
        <div class="log-box" id="signal-log">
            <div style="color:#8b949e;">[System Ready. Tap 'BOOT SYSTEM']</div>
        </div>
        <div style="margin-top: 15px;">
            <a href="/" style="color:#39ff14; text-decoration:none; font-family:monospace; font-weight:bold;">← RETURN TO MAIN DESK</a>
        </div>
    </div>

    <script>
        let active = false; 
        let recognition;
        let isMicEnabled = false;
        let isSpeaking = false;
        const logBox = document.getElementById('signal-log');
        const video = document.getElementById('localVideo');
        const canvas = document.getElementById('captureCanvas');

        function printLog(text, color="#c9d1d9") {
            logBox.innerHTML += `<div style="color:${color}">&gt; ${text}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function stopRobotSpeechDirectly() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            isSpeaking = false;
            printLog("Speech stopped.", "#ff0055");
        }

        function robotSpeak(text) {
            if (!text || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            isSpeaking = true;

            const utterance = new SpeechSynthesisUtterance(text.replace(/\*/g, ''));
            utterance.lang = /[\u0900-\u097F]/.test(text) ? 'mr-IN' : 'en-IN';
            utterance.onend = () => { isSpeaking = false; if (isMicEnabled) startListening(); };
            utterance.onerror = () => { isSpeaking = false; };
            window.speechSynthesis.speak(utterance);
        }

        async function bootRobotHead() {
            active = true;
            document.getElementById('act-btn').style.display = 'none';
            document.getElementById('status-text').innerHTML = "ONLINE";
            document.getElementById('status-text').style.color = "#39ff14";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: 480, height: 360 },
                    audio: false
                });
                video.srcObject = stream;
                printLog("Camera active. Streaming frames to Cloud...", "#39ff14");

                // Start continuous frame uploading to /api/video_feed (10 fps)
                setInterval(captureAndUploadFrame, 100);
            } catch (err) {
                printLog("Camera error: " + err.message, "#ff5555");
            }

            initVoiceEngine();
            setInterval(checkMicStatus, 1000); // Check if operator toggled mic ON
            robotSpeak("TiTaN system online.");
        }

        function captureAndUploadFrame() {
            if (!active || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            canvas.width = 320;
            canvas.height = 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
                if (blob) {
                    fetch('/api/video_feed', {
                        method: 'POST',
                        body: blob,
                        headers: { 'Content-Type': 'image/jpeg' }
                    }).catch(() => {});
                }
            }, 'image/jpeg', 0.5);
        }

        async function checkMicStatus() {
            if (!active) return;
            try {
                const res = await fetch('/api/mic_status');
                const data = await res.json();
                if (data.mic_active !== isMicEnabled) {
                    isMicEnabled = data.mic_active;
                    if (isMicEnabled) {
                        printLog("Remote Mic ENABLED by Dashboard!", "#39ff14");
                        startListening();
                    } else {
                        printLog("Remote Mic DISABLED by Dashboard.", "#ffaa00");
                        if (recognition) recognition.abort();
                    }
                }
            } catch (e) {}
        }

        function initVoiceEngine() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                printLog("Speech Recognition unsupported.", "#ff5555");
                return;
            }
            recognition = new window.SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'mr-IN';

            recognition.onresult = async (event) => {
                const speech = event.results[0][0].transcript.toLowerCase().trim();
                printLog(`Captured: "${speech}"`, "#fff");

                const drive = (cmd) => {
                    fetch('/api/cmd', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ command: cmd })
                    });
                };

                if (speech.includes("forward") || speech.includes("पुढे") || speech.includes("आगे")) {
                    drive('FORWARD'); robotSpeak("Moving forward."); return;
                }
                if (speech.includes("reverse") || speech.includes("मागे") || speech.includes("पीछे")) {
                    drive('REVERSE'); robotSpeak("Backing up."); return;
                }
                if (speech.includes("left") || speech.includes("डावीकडे") || speech.includes("बाये")) {
                    drive('LEFT'); robotSpeak("Turning left."); return;
                }
                if (speech.includes("right") || speech.includes("उजवीकडे") || speech.includes("दाये")) {
                    drive('RIGHT'); robotSpeak("Turning right."); return;
                }
                if (speech.includes("stop") || speech.includes("थांब") || speech.includes("रुको")) {
                    drive('STOP'); robotSpeak("Stopping."); return;
                }

                if (speech.length > 2) {
                    robotSpeak("Checking...");
                    const res = await fetch('/api/ask_ai', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: speech })
                    });
                    const data = await res.json();
                    robotSpeak(data.reply);
                }
            };

            recognition.onend = () => {
                if (active && isMicEnabled && !isSpeaking) {
                    setTimeout(startListening, 400);
                }
            };
        }

        function startListening() {
            if (!recognition || isSpeaking || !isMicEnabled) return;
            try { recognition.start(); } catch(e){}
        }
    </script>
</body>
</html>
