<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN AI - Robot Node</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body { background-color: #0b0e14; color: #c9d1d9; font-family: Arial, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .robot-box { border: 2px solid #39ff14; background: #101520; border-radius: 12px; padding: 30px; text-align: center; width: 90%; max-width: 500px; box-shadow: 0 0 20px rgba(57, 255, 20, 0.15); }
        .header-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 5px; }
        .logo-img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #39ff14; }
        .badge { background: transparent; border: 2px solid #39ff14; color: #39ff14; padding: 1px 8px; border-radius: 5px; font-size: 0.95rem; font-weight: bold; font-family: monospace; }
        .subtext { color: #8b949e; font-size: 0.9rem; letter-spacing: 1px; margin: 0 0 20px 0; font-family: monospace; }
        .live-indicator { color: #39ff14; font-weight: bold; animation: blink 1.5s infinite; }
        .log-box { background: #070a0f; border: 1px solid #30363d; height: 200px; border-radius: 6px; margin-top: 20px; padding: 10px; overflow-y: auto; text-align: left; font-family: monospace; font-size: 0.85rem; }
        .action-btn { background: #101520; border: 2px solid #39ff14; color: #39ff14; padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 25px; transition: 0.3s; }
        .action-btn:hover { background: #39ff14; color: #000; }
        .video-preview { width: 100%; height: 180px; background: #000; border-radius: 6px; margin-top: 15px; overflow: hidden; scroll-margin-top: 20px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .nav-link { color: #39ff14; text-decoration: none; font-family: monospace; font-weight: bold; font-size: 0.95rem; transition: 0.2s; }
        .nav-link:hover { text-decoration: underline; opacity: 0.8; }
        @keyframes blink { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
</head>
<body>
    <div class="robot-box">
        <div class="header-container">
            <img src="/favicon.ico" class="logo-img" alt="Logo">
            <h1 style="color:#39ff14; margin:0; font-size:1.6rem; letter-spacing:2px;">TITAN CORE NODE</h1>
            <span class="badge">MD</span>
        </div>
        <div class="subtext">TiTaN Labs Of iNNvovention</div>
        <div>SYSTEM ENGINE STATUS: <span id="status-text" style="color:#ffaa00;">OFFLINE</span></div>
        <div class="video-preview">
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <button class="action-btn" id="act-btn" onclick="bootRobotHead()">BOOT SYSTEM</button>
        <div class="log-box" id="signal-log">
            <div style="color:#8b949e;">[System Ready. Awaiting User Activation Loop...]</div>
        </div>
        <div style="margin-top: 20px; border-top: 1px solid #30363d; padding-top: 15px; display: flex; flex-direction: column; gap: 10px;">
            <a href="/" class="nav-link">← RETURN TO MAIN CONTROL DESK</a>
            <a href="#localVideo" class="nav-link" style="color: #ff007f;">📸 VIEW LOCAL PHONE CAMERA FEED ↓</a>
        </div>
    </div>

    <script>
        let ws; let recognition; let active = false; let localStream; let peerConnection;
        let speechQueue = []; let isSpeaking = false; let isProcessing = false;
        const logBox = document.getElementById('signal-log');
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function printLog(text, color="#c9d1d9") {
            logBox.innerHTML += `<div style="color:${color}">&gt; ${text}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function robotSpeak(textToSay) {
            if (!textToSay) return;
            
            speechQueue = [];
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            const cleanText = textToSay.replace(/\*/g, '').replace(/#/g, '').trim();
            const fragments = cleanText.match(/[^.!?\n\।]+[.!?\n\裝]*/g) || [cleanText];
            
            fragments.forEach(frag => {
                if (frag.trim().length > 0) speechQueue.push(frag.trim());
            });

            isSpeaking = false;
            processNextQueueItem();
        }

        function processNextQueueItem() {
            if ('speechSynthesis' in window) {
                if (speechQueue.length === 0) {
                    isSpeaking = false;
                    isProcessing = false;
                    setTimeout(() => {
                        if (active) startListeningLoop();
                    }, 800);
                    return;
                }
                
                isSpeaking = true;
                const nextUtteranceText = speechQueue.shift();
                const voiceOut = new SpeechSynthesisUtterance(nextUtteranceText);
                const DevanagariPattern = /[\u0900-\u097F]/;
                
                if (DevanagariPattern.test(nextUtteranceText)) {
                    if (nextUtteranceText.includes("आहे") || nextUtteranceText.includes("आहात") || nextUtteranceText.includes("नाही") || nextUtteranceText.includes("चालू") || nextUtteranceText.includes("म्हणजे") || nextUtteranceText.includes("राजा")) {
                        voiceOut.lang = 'mr-IN';
                    } else {
                        voiceOut.lang = 'hi-IN';
                    }
                } else {
                    voiceOut.lang = 'en-IN';
                }

                voiceOut.rate = 0.92;
                voiceOut.pitch = 0.90; // Creates an authoritative baritone profile

                const systemVoices = window.speechSynthesis.getVoices();
                let maleVoice = systemVoices.find(v => 
                    v.lang === voiceOut.lang && 
                    (v.name.toLowerCase().includes('google male') || 
                     v.name.toLowerCase().includes('male') || 
                     v.name.toLowerCase().includes('david') || 
                     v.name.toLowerCase().includes('ravi') || 
                     v.name.toLowerCase().includes('premium'))
                );

                if (!maleVoice) {
                    maleVoice = systemVoices.find(v => v.lang === voiceOut.lang);
                }
                if (maleVoice) voiceOut.voice = maleVoice;

                voiceOut.onend = () => { setTimeout(processNextQueueItem, 50); };
                voiceOut.onerror = () => { isSpeaking = false; setTimeout(processNextQueueItem, 50); };

                if (recognition) { 
                    try { recognition.abort(); } catch(err){} 
                }
                
                window.speechSynthesis.speak(voiceOut);
            }
        }

        async function bootRobotHead() {
            active = true;
            document.getElementById('act-btn').style.display = 'none';
            document.getElementById('status-text').innerHTML = "ONLINE";
            document.getElementById('status-text').className = "live-indicator";
            
            initWebSocket();
            initVoiceRecognitionEngine();
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: 640, height: 480 }, 
                    audio: false 
                });
                document.getElementById('localVideo').srcObject = localStream;
                printLog("Camera stream pipeline unblocked.", "#39ff14");
            } catch (err) { 
                printLog("Camera access blocked by browser.", "#ff5555"); 
            }
            
            setTimeout(() => {
                robotSpeak("System online boss. TiTaN core ready.");
            }, 1000);
        }

        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + window.location.host + '/core');
            ws.onopen = () => { ws.send(JSON.stringify({ register: 'robot' })); printLog("Connected to Python Core Hub.", "#39ff14"); };
            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data); 
                if (data.type === "ai_reply") {
                    printLog(`Processing AI instruction stream...`, "#39ff14");
                    robotSpeak(data.payload);
                } 
                else if (data.type === "movement") {
                    printLog(`Movement Received: [${data.payload}]`, "#39ff14");
                    robotSpeak(data.payload === "STOP" ? "Stopping" : "Executing movement");
                } 
                else if (data.type === "sdp" && data.sdp.type === 'offer') {
                    peerConnection = new RTCPeerConnection(rtcConfig);
                    if (localStream) {
                        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                    }
                    peerConnection.onicecandidate = (e) => { 
                        if (e.candidate && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate })); 
                        }
                    };
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    ws.send(JSON.stringify({ type: 'sdp', sdp: answer })); 
                } else if (data.type === "candidate" && peerConnection) {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
                }
            };
            ws.onclose = () => { setTimeout(initWebSocket, 3000); };
        }

        function initVoiceRecognitionEngine() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if(!window.SpeechRecognition) {
                printLog("Speech Recognition unsupported on this engine tool.", "#ff5555");
                return;
            }
            
            recognition = new window.SpeechRecognition();
            recognition.continuous = false; 
            recognition.interimResults = false; 
            recognition.lang = ''; 

            recognition.onstart = () => {
                isProcessing = false;
                printLog("Mic listening...", "#00e5ff");
            };

            recognition.onend = () => {
                if (active && !isSpeaking && !isProcessing) {
                    setTimeout(startListeningLoop, 300);
                }
            };

            recognition.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    printLog("Mic state variance catch: " + event.error, "#ff5555");
                }
            };

            recognition.onresult = (event) => {
                isProcessing = true; 
                const speech = event.results[0][0].transcript.toLowerCase().trim();
                printLog(`Captured: "${speech}"`, "#fff");
                
                if (speech.includes("titan") || speech.includes("tighten") || speech.includes("टाय") || speech.includes("टीटा")) {
                    
                    if (speech.includes("forward") || speech.includes("पुढे") || speech.includes("आगे")) {
                        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'movement', payload: 'FORWARD' }));
                        robotSpeak("Moving forward.");
                        return;
                    } 
                    if (speech.includes("reverse") || speech.includes("मागे") || speech.includes("पीछे")) {
                        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'movement', payload: 'REVERSE' }));
                        robotSpeak("Backing up.");
                        return;
                    } 
                    if (speech.includes("left") || speech.includes("डावीकडे") || speech.includes("बाये")) {
                        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'movement', payload: 'LEFT' }));
                        robotSpeak("Turning left.");
                        return;
                    } 
                    if (speech.includes("right") || speech.includes("उजवीकडे") || speech.includes("दाये")) {
                        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'movement', payload: 'RIGHT' }));
                        robotSpeak("Turning right.");
                        return;
                    } 
                    if (speech.includes("stop") || speech.includes("थांब") || speech.includes("रुको")) {
                        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'movement', payload: 'STOP' }));
                        robotSpeak("Stopping all engines.");
                        return;
                    } 
                    
                    robotSpeak("Analyzing query.");
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'question', payload: speech }));
                    }
                } else {
                    isProcessing = false;
                }
            };
        }

        function startListeningLoop() {
            if (!active || isSpeaking || isProcessing) return;
            try {
                recognition.start();
            } catch(e) {}
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }
    </script>
</body>
</html>
