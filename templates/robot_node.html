<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN AI - Robot Node</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body { background-color: #0b0e14; color: #c9d1d9; font-family: Arial, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .robot-box { border: 2px solid #39ff14; background: #101520; border-radius: 12px; padding: 25px; text-align: center; width: 90%; max-width: 480px; }
        .header-container { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .logo-img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #39ff14; }
        .badge { border: 2px solid #39ff14; color: #39ff14; padding: 1px 8px; border-radius: 5px; font-family: monospace; font-weight: bold; }
        .video-preview { width: 100%; height: 180px; background: #000; border-radius: 6px; margin-top: 15px; overflow: hidden; border: 1px solid #39ff14; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .action-btn { background: #101520; border: 2px solid #39ff14; color: #39ff14; padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        .action-btn:hover { background: #39ff14; color: #000; }
        .stop-btn { background: #ff0055; border: none; color: #fff; padding: 10px 20px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; }
        .log-box { background: #070a0f; border: 1px solid #30363d; height: 160px; border-radius: 6px; margin-top: 15px; padding: 10px; overflow-y: auto; text-align: left; font-family: monospace; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="robot-box">
        <div class="header-container">
            <img src="/favicon.ico" class="logo-img" alt="Logo">
            <h1 style="color:#39ff14; margin:0; font-size:1.6rem;">TITAN CORE NODE</h1>
            <span class="badge">MD</span>
        </div>
        <div style="margin-top: 5px;">STATUS: <span id="status-text" style="color:#ffaa00;">OFFLINE</span></div>
        <div class="video-preview">
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <button class="action-btn" id="act-btn" onclick="bootRobotHead()">BOOT SYSTEM</button>
        <button class="stop-btn" onclick="stopRobotSpeechDirectly()">🛑 STOP SPEAKING</button>
        <div class="log-box" id="signal-log">
            <div style="color:#8b949e;">[System Ready. Awaiting Boot...]</div>
        </div>
        <div style="margin-top: 15px;">
            <a href="/" style="color:#39ff14; text-decoration:none; font-family:monospace; font-weight:bold;">← RETURN TO MAIN DESK</a>
        </div>
    </div>

    <script>
        let ws; let recognition; let active = false; 
        let micEnabledByDashboard = false;
        let localStream; let peerConnection;
        let speechQueue = []; let isSpeaking = false; let isProcessing = false;
        let micRestartTimer = null; let heartbeatTimer = null;

        const logBox = document.getElementById('signal-log');
        const rtcConfig = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ] 
        };

        function printLog(text, color="#c9d1d9") {
            logBox.innerHTML += `<div style="color:${color}">&gt; ${text}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function stopRobotSpeechDirectly() {
            speechQueue = []; isSpeaking = false; isProcessing = false;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            printLog("Speech canceled.", "#ff0055");
            setTimeout(() => { if (active && micEnabledByDashboard) startListeningLoop(); }, 300);
        }

        function robotSpeak(textToSay) {
            if (!textToSay || !('speechSynthesis' in window)) return;
            speechQueue = [];
            window.speechSynthesis.cancel();
            stopMicSafely();

            const cleanText = textToSay.replace(/\*/g, '').replace(/#/g, '').trim();
            const fragments = cleanText.match(/[^.!?\n\।]+[.!?\n\।]*/g) || [cleanText];
            fragments.forEach(f => { if (f.trim()) speechQueue.push(f.trim()); });

            isSpeaking = true;
            processNextQueue();
        }

        function processNextQueue() {
            if (speechQueue.length === 0) {
                isSpeaking = false; isProcessing = false;
                setTimeout(() => { if (active && micEnabledByDashboard) startListeningLoop(); }, 500);
                return;
            }
            isSpeaking = true;
            const text = speechQueue.shift();
            const voiceOut = new SpeechSynthesisUtterance(text);
            voiceOut.lang = /[\u0900-\u097F]/.test(text) ? 'mr-IN' : 'en-IN';
            voiceOut.onend = () => setTimeout(processNextQueue, 50);
            voiceOut.onerror = () => { isSpeaking = false; setTimeout(processNextQueue, 50); };
            stopMicSafely();
            window.speechSynthesis.speak(voiceOut);
        }

        async function bootRobotHead() {
            active = true;
            document.getElementById('act-btn').style.display = 'none';
            document.getElementById('status-text').innerHTML = "ONLINE";
            document.getElementById('status-text').style.color = "#39ff14";

            initWebSocket();
            initVoiceEngine();

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: 640, height: 480 }, 
                    audio: false 
                });
                document.getElementById('localVideo').srcObject = localStream;
                printLog("Camera stream pipeline active.", "#39ff14");
            } catch (err) {
                printLog("Camera error: " + err.message, "#ff5555");
            }

            printLog("Mic Standby: Waiting for Dashboard trigger...", "#ffaa00");
            setTimeout(() => robotSpeak("System online boss. TiTaN ready."), 800);
        }

        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + window.location.host + '/core');

            ws.onopen = () => {
                ws.send(JSON.stringify({ register: 'robot' }));
                printLog("Connected to Render Core Hub.", "#39ff14");
                
                clearInterval(heartbeatTimer);
                heartbeatTimer = setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ping_heartbeat' }));
                }, 5000);
            };

            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'toggle_mic') {
                    micEnabledByDashboard = data.state;
                    if (micEnabledByDashboard) {
                        printLog("Remote Mic ENABLED by Dashboard.", "#39ff14");
                        startListeningLoop();
                    } else {
                        printLog("Remote Mic DISABLED by Dashboard.", "#ffaa00");
                        stopMicSafely();
                    }
                } else if (data.type === 'stop_speech') {
                    stopRobotSpeechDirectly();
                } else if (data.type === 'ai_reply') {
                    printLog("AI response received.", "#39ff14");
                    robotSpeak(data.payload);
                } else if (data.type === 'movement') {
                    printLog(`Movement: [${data.payload}]`, "#39ff14");
                    robotSpeak(data.payload === "STOP" ? "Stopping" : "Moving");
                } else if (data.type === 'sdp' && data.sdp.type === 'offer') {
                    printLog("Negotiating video stream with dashboard...", "#00e5ff");
                    peerConnection = new RTCPeerConnection(rtcConfig);
                    
                    if (localStream) {
                        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                    }

                    peerConnection.onicecandidate = (e) => {
                        if (e.candidate && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'candidate', candidate: e.candidate }));
                        }
                    };

                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    ws.send(JSON.stringify({ type: 'sdp', sdp: answer }));
                    printLog("Video pipeline established!", "#39ff14");
                } else if (data.type === 'candidate' && peerConnection) {
                    try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch(e){}
                }
            };

            ws.onclose = () => {
                printLog("Reconnecting...", "#ffaa00");
                clearInterval(heartbeatTimer);
                setTimeout(initWebSocket, 2000);
            };
        }

        function initVoiceEngine() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                printLog("Speech Recognition unsupported.", "#ff5555");
                return;
            }
            recognition = new window.SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'mr-IN';

            recognition.onstart = () => { isProcessing = false; printLog("Mic active & listening...", "#00e5ff"); };
            recognition.onend = () => {
                isProcessing = false;
                if (active && !isSpeaking && micEnabledByDashboard) {
                    clearTimeout(micRestartTimer);
                    micRestartTimer = setTimeout(startListeningLoop, 500);
                }
            };
            recognition.onerror = (e) => {
                isProcessing = false;
                if (e.error !== 'no-speech' && e.error !== 'aborted') printLog("Mic notice: " + e.error, "#ffaa00");
            };

            recognition.onresult = (event) => {
                isProcessing = true;
                stopMicSafely();
                const speech = event.results[0][0].transcript.toLowerCase().trim();
                printLog(`Captured: "${speech}"`, "#fff");

                const dispatchDrive = (dir) => {
                    fetch('/api/cmd', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ command: dir }),
                        keepalive: true
                    }).catch(() => {});
                    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'movement', payload: dir }));
                };

                if (speech.includes("forward") || speech.includes("पुढे") || speech.includes("आगे")) {
                    dispatchDrive('FORWARD'); robotSpeak("Moving forward."); return;
                }
                if (speech.includes("reverse") || speech.includes("मागे") || speech.includes("पीछे")) {
                    dispatchDrive('REVERSE'); robotSpeak("Backing up."); return;
                }
                if (speech.includes("left") || speech.includes("डावीकडे") || speech.includes("बाये")) {
                    dispatchDrive('LEFT'); robotSpeak("Turning left."); return;
                }
                if (speech.includes("right") || speech.includes("उजवीकडे") || speech.includes("दाये")) {
                    dispatchDrive('RIGHT'); robotSpeak("Turning right."); return;
                }
                if (speech.includes("stop") || speech.includes("थांब") || speech.includes("रुको")) {
                    dispatchDrive('STOP'); robotSpeak("Stopping."); return;
                }

                if (speech.length > 2) {
                    robotSpeak("Analyzing.");
                    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'question', payload: speech }));
                } else {
                    isProcessing = false;
                    setTimeout(() => { if (active && !isSpeaking && micEnabledByDashboard) startListeningLoop(); }, 400);
                }
            };
        }

        function stopMicSafely() {
            if (recognition) { try { recognition.abort(); } catch(e){} }
        }

        function startListeningLoop() {
            if (!active || isSpeaking || !micEnabledByDashboard) return;
            isProcessing = false;
            try { recognition.start(); } catch(e){}
        }
    </script>
</body>
</html>
