<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TiTaN - Smart Phone Node</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="node-page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="node-header">

        <h1>
            TITAN // SMART PHONE NODE
        </h1>

        <p>
            Camera • Microphone • AI Communication
        </p>

        <a
            href="/"
            class="node-back-link"
        >
            ← BACK TO CENTRAL COMMAND
        </a>

    </header>


    <!-- =====================================================
         MAIN NODE
    ====================================================== -->

    <main class="node-container">


        <!-- CAMERA -->

        <section class="node-panel">

            <h2>📷 PHONE CAMERA</h2>

            <div class="phone-camera-box">

                <video
                    id="localVideo"
                    autoplay
                    muted
                    playsinline
                ></video>

                <div
                    id="cameraPlaceholder"
                    class="camera-message"
                >
                    CAMERA OFFLINE
                </div>

            </div>


            <canvas
                id="captureCanvas"
                width="640"
                height="480"
                hidden
            ></canvas>


            <div class="node-buttons">

                <button
                    id="startCamera"
                    class="primary-btn"
                >
                    START CAMERA
                </button>

                <button
                    id="stopCamera"
                    class="danger-btn"
                >
                    STOP CAMERA
                </button>

            </div>

        </section>


        <!-- SYSTEM STATUS -->

        <section class="node-panel">

            <h2>⚡ NODE STATUS</h2>

            <div class="node-status-grid">

                <div class="status-card">
                    <span>SERVER</span>
                    <strong id="node-server">
                        OFFLINE
                    </strong>
                </div>

                <div class="status-card">
                    <span>PHONE</span>
                    <strong id="node-phone">
                        OFFLINE
                    </strong>
                </div>

                <div class="status-card">
                    <span>ESP32</span>
                    <strong id="node-esp32">
                        OFFLINE
                    </strong>
                </div>

                <div class="status-card">
                    <span>CAMERA</span>
                    <strong id="node-camera">
                        OFFLINE
                    </strong>
                </div>

                <div class="status-card">
                    <span>MIC</span>
                    <strong id="node-mic">
                        OFF
                    </strong>
                </div>

                <div class="status-card">
                    <span>MOTOR</span>
                    <strong id="node-motor">
                        STOP
                    </strong>
                </div>

            </div>

        </section>


        <!-- BOOT -->

        <section class="node-panel">

            <h2>🚀 TITAN NODE CONTROL</h2>

            <button
                id="bootButton"
                class="boot-btn"
            >
                BOOT TITAN NODE
            </button>

            <button
                id="micButton"
                class="secondary-btn"
            >
                🎙️ ENABLE MICROPHONE
            </button>

        </section>


        <!-- LOG -->

        <section class="node-panel">

            <h2>📡 COMMUNICATION LOG</h2>

            <div
                id="nodeLog"
                class="node-log"
            >
                <div>
                    [System] Node initialized.
                </div>
            </div>

        </section>


    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        // ====================================================
        // VARIABLES
        // ====================================================

        let cameraStream = null;

        let cameraRunning = false;

        let nodeActive = false;

        let micEnabled = false;

        let recognition = null;

        let heartbeatTimer = null;

        let frameTimer = null;

        let speaking = false;


        const video =
            document.getElementById(
                "localVideo"
            );


        const canvas =
            document.getElementById(
                "captureCanvas"
            );


        const ctx =
            canvas.getContext("2d");


        // ====================================================
        // LOG
        // ====================================================

        function nodeLog(
            message,
            type = "normal"
        ) {

            const box =
                document.getElementById(
                    "nodeLog"
                );


            const line =
                document.createElement(
                    "div"
                );


            line.className =
                "log-" + type;


            line.textContent =
                "[" +
                new Date().toLocaleTimeString() +
                "] " +
                message;


            box.appendChild(line);

            box.scrollTop =
                box.scrollHeight;

        }


        // ====================================================
        // CAMERA
        // ====================================================

        async function startCamera() {

            if (cameraRunning) {
                return;
            }


            try {

                cameraStream =
                    await navigator.mediaDevices
                        .getUserMedia({

                            video: {
                                facingMode:
                                    "environment",

                                width: {
                                    ideal: 640
                                },

                                height: {
                                    ideal: 480
                                }
                            },

                            audio: false

                        });


                video.srcObject =
                    cameraStream;


                cameraRunning = true;


                document
                    .getElementById(
                        "cameraPlaceholder"
                    )
                    .style.display =
                        "none";


                nodeLog(
                    "Phone camera started.",
                    "success"
                );


                startFrameUpload();


            } catch (error) {

                nodeLog(
                    "Camera permission failed: " +
                    error.message,
                    "error"
                );

            }

        }


        // ====================================================
        // STOP CAMERA
        // ====================================================

        function stopCamera() {

            cameraRunning = false;


            if (frameTimer) {

                clearInterval(
                    frameTimer
                );

                frameTimer = null;

            }


            if (cameraStream) {

                cameraStream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

                cameraStream = null;

            }


            video.srcObject = null;


            document
                .getElementById(
                    "cameraPlaceholder"
                )
                .style.display =
                    "flex";


            nodeLog(
                "Phone camera stopped."
            );

        }


        // ====================================================
        // FRAME UPLOAD
        // ====================================================

        function startFrameUpload() {

            if (frameTimer) {

                clearInterval(
                    frameTimer
                );

            }


            frameTimer =
                setInterval(
                    uploadFrame,
                    500
                );

        }


        async function uploadFrame() {

            if (
                !cameraRunning ||
                !video.videoWidth
            ) {
                return;
            }


            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            ctx.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );


            canvas.toBlob(
                async function(blob) {

                    if (!blob) {
                        return;
                    }


                    try {

                        const response =
                            await fetch(
                                "/api/video_feed",
                                {

                                    method:
                                        "POST",

                                    headers: {
                                        "Content-Type":
                                            "image/jpeg"
                                    },

                                    body: blob

                                }
                            );


                        if (
                            !response.ok
                        ) {

                            nodeLog(
                                "Camera upload failed.",
                                "error"
                            );

                        }

                    } catch (error) {

                        nodeLog(
                            "Camera server connection lost.",
                            "error"
                        );

                    }

                },

                "image/jpeg",

                0.65
            );

        }


        // ====================================================
        // HEARTBEAT
        // ====================================================

        async function heartbeat() {

            try {

                await fetch(
                    "/api/phone/heartbeat",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            node: "phone"
                        })

                    }
                );

            } catch (error) {

                console.log(
                    "Heartbeat failed."
                );

            }

        }


        function startHeartbeat() {

            heartbeat();

            if (heartbeatTimer) {

                clearInterval(
                    heartbeatTimer
                );

            }


            heartbeatTimer =
                setInterval(
                    heartbeat,
                    2000
                );

        }


        // ====================================================
        // SYSTEM BOOT
        // ====================================================

        document
            .getElementById(
                "bootButton"
            )
            .addEventListener(
                "click",
                async function() {

                    nodeActive =
                        !nodeActive;


                    const button =
                        document.getElementById(
                            "bootButton"
                        );


                    if (nodeActive) {

                        button.textContent =
                            "SHUTDOWN TITAN NODE";

                        button.classList.add(
                            "active"
                        );


                        nodeLog(
                            "TiTaN node activated.",
                            "success"
                        );


                        startHeartbeat();

                        await startCamera();

                        initSpeechRecognition();


                    } else {

                        button.textContent =
                            "BOOT TITAN NODE";

                        button.classList.remove(
                            "active"
                        );


                        stopCamera();

                        disableMicrophone();


                        nodeLog(
                            "TiTaN node shutdown.",
                            "error"
                        );

                    }

                }
            );


        // ====================================================
        // MICROPHONE
        // ====================================================

        document
            .getElementById(
                "micButton"
            )
            .addEventListener(
                "click",
                function() {

                    if (!nodeActive) {

                        nodeLog(
                            "Boot the node first.",
                            "error"
                        );

                        return;

                    }


                    if (micEnabled) {

                        disableMicrophone();

                    } else {

                        enableMicrophone();

                    }

                }
            );


        async function enableMicrophone() {

            initSpeechRecognition();


            if (!recognition) {

                nodeLog(
                    "Speech recognition is not supported by this browser.",
                    "error"
                );

                return;

            }


            micEnabled = true;


            const button =
                document.getElementById(
                    "micButton"
                );


            button.textContent =
                "🔴 MICROPHONE ON";


            button.classList.add(
                "active"
            );


            await fetch(
                "/api/mic_status",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        active: true
                    })

                }
            );


            nodeLog(
                "Microphone enabled.",
                "success"
            );


            startListening();

        }


        async function disableMicrophone() {

            micEnabled = false;


            if (recognition) {

                try {
                    recognition.stop();
                } catch (e) {}

            }


            const button =
                document.getElementById(
                    "micButton"
                );


            button.textContent =
                "🎙️ ENABLE MICROPHONE";


            button.classList.remove(
                "active"
            );


            try {

                await fetch(
                    "/api/mic_status",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            active: false
                        })

                    }
                );

            } catch (e) {}


            nodeLog(
                "Microphone disabled."
            );

        }


        // ====================================================
        // SPEECH RECOGNITION
        // ====================================================

        function initSpeechRecognition() {

            const SpeechRecognition =
                window.SpeechRecognition ||
                window.webkitSpeechRecognition;


            if (!SpeechRecognition) {

                recognition = null;

                return;

            }


            if (recognition) {
                return;
            }


            recognition =
                new SpeechRecognition();


            recognition.continuous =
                false;


            recognition.interimResults =
                false;


            recognition.lang =
                "en-IN";


            recognition.onresult =
                async function(event) {

                    const text =
                        event
                            .results[0][0]
                            .transcript
                            .trim();


                    nodeLog(
                        "Heard: " + text,
                        "user"
                    );


                    await processVoiceCommand(
                        text
                    );

                };


            recognition.onerror =
                function(event) {

                    console.log(
                        "Speech error:",
                        event.error
                    );

                };


            recognition.onend =
                function() {

                    if (
                        nodeActive &&
                        micEnabled &&
                        !speaking
                    ) {

                        setTimeout(
                            startListening,
                            500
                        );

                    }

                };

        }


        function startListening() {

            if (
                !nodeActive ||
                !micEnabled ||
                speaking ||
                !recognition
            ) {
                return;
            }


            try {

                recognition.start();

            } catch (error) {

                // Browser may report
                // "already started".

            }

        }


        // ====================================================
        // VOICE COMMAND
        // ====================================================

        async function processVoiceCommand(
            text
        ) {

            const command =
                text.toLowerCase();


            // Forward
            if (
                command.includes("forward") ||
                command.includes("move ahead") ||
                command.includes("पुढे")
            ) {

                await sendMotor(
                    "FORWARD"
                );

                speak(
                    "Moving forward."
                );

                return;

            }


            // Backward
            if (
                command.includes("backward") ||
                command.includes("reverse") ||
                command.includes("मागे")
            ) {

                await sendMotor(
                    "BACKWARD"
                );

                speak(
                    "Moving backward."
                );

                return;

            }


            // Left
            if (
                command.includes("left") ||
                command.includes("डावीकडे")
            ) {

                await sendMotor(
                    "LEFT"
                );

                speak(
                    "Turning left."
                );

                return;

            }


            // Right
            if (
                command.includes("right") ||
                command.includes("उजवीकडे")
            ) {

                await sendMotor(
                    "RIGHT"
                );

                speak(
                    "Turning right."
                );

                return;

            }


            // Stop
            if (
                command.includes("stop") ||
                command.includes("थांब")
            ) {

                await sendMotor(
                    "STOP"
                );

                speak(
                    "Stopping."
                );

                return;

            }


            // Otherwise AI
            await askAI(text);

        }


        // ====================================================
        // MOTOR
        // ====================================================

        async function sendMotor(
            command
        ) {

            try {

                const response =
                    await fetch(
                        "/api/cmd",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                command:
                                    command
                            })

                        }
                    );


                const data =
                    await response.json();


                if (data.command) {

                    document
                        .getElementById(
                            "node-motor"
                        )
                        .textContent =
                            data.command;

                }


            } catch (error) {

                nodeLog(
                    "Motor command failed.",
                    "error"
                );

            }

        }


        // ====================================================
        // AI
        // ====================================================

        async function askAI(
            question
        ) {

            try {

                nodeLog(
                    "TiTaN AI processing...",
                    "ai"
                );


                const response =
                    await fetch(
                        "/api/ask_ai",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                query:
                                    question
                            })

                        }
                    );


                const data =
                    await response.json();


                if (
                    data.reply
                ) {

                    nodeLog(
                        "TiTaN: " +
                        data.reply,
                        "success"
                    );


                    speak(
                        data.reply
                    );

                }

            } catch (error) {

                nodeLog(
                    "AI connection failed.",
                    "error"
                );

            }

        }


        // ====================================================
        // SPEAK
        // ====================================================

        function speak(text) {

            if (
                !("speechSynthesis" in window)
            ) {
                return;
            }


            speaking = true;


            if (recognition) {

                try {
                    recognition.stop();
                } catch (e) {}

            }


            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );


            if (
                /[\u0900-\u097F]/.test(text)
            ) {

                utterance.lang =
                    "mr-IN";

            } else {

                utterance.lang =
                    "en-IN";

            }


            utterance.rate =
                0.95;

            utterance.pitch =
                0.9;


            utterance.onend =
                function() {

                    speaking = false;

                    if (
                        nodeActive &&
                        micEnabled
                    ) {

                        setTimeout(
                            startListening,
                            500
                        );

                    }

                };


            window.speechSynthesis.speak(
                utterance
            );

        }


        // ====================================================
        // HEALTH
        // ====================================================

        async function updateNodeHealth() {

            try {

                const response =
                    await fetch(
                        "/api/health",
                        {
                            cache:
                                "no-store"
                        }
                    );


                const data =
                    await response.json();


                document
                    .getElementById(
                        "node-server"
                    )
                    .textContent =
                        data.server ||
                        "OFFLINE";


                document
                    .getElementById(
                        "node-phone"
                    )
                    .textContent =
                        data.phone ||
                        "OFFLINE";


                document
                    .getElementById(
                        "node-esp32"
                    )
                    .textContent =
                        data.esp32 ||
                        "OFFLINE";


                document
                    .getElementById(
                        "node-camera"
                    )
                    .textContent =
                        data.camera ||
                        "OFFLINE";


                document
                    .getElementById(
                        "node-mic"
                    )
                    .textContent =
                        data.microphone ||
                        "OFF";


                document
                    .getElementById(
                        "node-motor"
                    )
                    .textContent =
                        data.motor_command ||
                        "STOP";


            } catch (error) {

                document
                    .getElementById(
                        "node-server"
                    )
                    .textContent =
                        "OFFLINE";

            }

        }


        // ====================================================
        // START HEALTH CHECK
        // ====================================================

        updateNodeHealth();


        setInterval(
            updateNodeHealth,
            3000
        );


        // ====================================================
        // START CAMERA BUTTON
        // ====================================================

        document
            .getElementById(
                "startCamera"
            )
            .addEventListener(
                "click",
                startCamera
            );


        document
            .getElementById(
                "stopCamera"
            )
            .addEventListener(
                "click",
                stopCamera
            );

    </script>

</body>
</html>
