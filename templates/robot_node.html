<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    TiTaN // Mobile Vision Node
</title>


<style>

:root{

    --cyan:#00eaff;
    --green:#36f2a2;
    --red:#ff4567;

    --bg:#02060c;

}


*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    color:#eafaff;

    font-family:
        Segoe UI,
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at 50% 0,
            #12314d,
            #030711 55%,
            #010308
        );

}


/* CONTAINER */

.wrap{

    max-width:900px;

    margin:auto;

    padding:18px;

}


/* HEADER */

.head{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:14px;

}


.brand{

    letter-spacing:3px;

    font-weight:800;

}


.brand span{

    color:var(--cyan);

}


.back{

    color:var(--cyan);

    text-decoration:none;

    border:1px solid #16465c;

    padding:9px 12px;

    border-radius:9px;

    font-size:10px;

}


/* CARD */

.card{

    background:
        rgba(6,15,27,.88);

    border:
        1px solid
        rgba(0,234,255,.23);

    border-radius:18px;

    padding:14px;

    box-shadow:
        0 0 35px #0008;

    margin-bottom:14px;

}


.bar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding-bottom:11px;

}


.title{

    font-size:11px;

    letter-spacing:2px;

    color:var(--cyan);

}


.status{

    font-size:9px;

    color:var(--red);

}


.status.on{

    color:var(--green);

}


/* CAMERA */

.viewer{

    background:#000;

    border:1px solid #08718a;

    border-radius:12px;

    overflow:hidden;

    position:relative;

}


.viewer video{

    display:block;

    width:100%;

    max-height:70vh;

    object-fit:cover;

    background:#000;

}


/* SCAN EFFECT */

.scan{

    position:absolute;

    left:0;

    right:0;

    height:1px;

    background:#00eaff66;

    box-shadow:
        0 0 12px var(--cyan);

    animation:
        scan 3s linear infinite;

    pointer-events:none;

}


@keyframes scan{

    0%{
        top:0;
    }

    100%{
        top:100%;
    }

}


/* CAMERA BUTTONS */

.controls{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-top:12px;

}


button{

    padding:13px;

    border-radius:10px;

    background:#071525;

    border:1px solid #18506a;

    color:var(--cyan);

    font-weight:700;

    letter-spacing:1px;

}


button:active{

    background:#00eaff18;

}


.stop{

    color:#ff6b83;

    border-color:#69283a;

}


/* TELEMETRY */

.info{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;

}


.info div{

    background:#06101d;

    border:1px solid #13283a;

    border-radius:9px;

    padding:11px;

}


.info small{

    display:block;

    color:#637c92;

    font-size:8px;

    margin-bottom:5px;

}


.info b{

    font-size:11px;

}


/* LOG */

.note{

    color:#61778d;

    font:10px monospace;

    line-height:1.6;

    white-space:pre-line;

}


/* MOBILE */

@media(max-width:600px){

    .wrap{
        padding:10px;
    }


    .brand{
        font-size:12px;
    }


    .brand span{
        display:block;

        font-size:8px;

        margin-top:3px;
    }


    .info{

        grid-template-columns:
            repeat(3,1fr);

    }


    .viewer video{

        min-height:
            430px;

        object-fit:cover;

    }

}

</style>

</head>


<body>


<div class="wrap">


<header class="head">


    <div class="brand">

        TiTaN

        <span>
            // MOBILE VISION NODE
        </span>

    </div>


    <a
        class="back"
        href="/"
    >
        ← COMMAND CENTER
    </a>


</header>



<section class="card">


    <div class="bar">

        <span class="title">

            ◉ OPTICAL SENSOR ARRAY

        </span>


        <span
            id="state"
            class="status"
        >

            ● DISCONNECTED

        </span>

    </div>



    <div class="viewer">


        <video
            id="preview"
            autoplay
            playsinline
            muted
        ></video>


        <div class="scan"></div>


    </div>



    <div class="controls">


        <button
            onclick="startCamera()"
        >

            START CAMERA

        </button>


        <button
            onclick="stopCamera()"
            class="stop"
        >

            STOP CAMERA

        </button>


    </div>


</section>



<section class="card">


    <div class="bar">

        <span class="title">

            ◈ NODE TELEMETRY

        </span>


        <span class="status on">

            ● READY

        </span>

    </div>



    <div class="info">


        <div>

            <small>
                CAMERA
            </small>

            <b id="cam">
                OFFLINE
            </b>

        </div>


        <div>

            <small>
                SERVER LINK
            </small>

            <b id="server">
                CHECKING
            </b>

        </div>


        <div>

            <small>
                FRAME RATE
            </small>

            <b>
                ~2 FPS
            </b>

        </div>


    </div>


</section>



<section class="card">


    <div class="title">
        NODE LOG
    </div>


    <p
        id="log"
        class="note"
    >
        [BOOT] Mobile vision node initialized.
    </p>


</section>


</div>



<canvas
    id="canvas"
    style="display:none"
></canvas>



<script>


let stream=null;

let timer=null;



const $=
    id=>
        document.getElementById(id);



/* LOG */

function log(message){

    $("log").textContent +=
        "\n"+message;

}



/* START CAMERA */

async function startCamera(){

    try{

        if(stream)
            return;


        stream=
            await navigator.mediaDevices
            .getUserMedia({

                video:{

                    facingMode:{
                        ideal:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }

                },

                audio:false

            });


        $("preview").srcObject=
            stream;


        $("cam").textContent=
            "ONLINE";


        $("state").textContent=
            "● CONNECTED";


        $("state").className=
            "status on";


        log(
            "[CAM] Camera access granted."
        );


        timer=
            setInterval(
                sendFrame,
                500
            );


    }catch(error){

        log(
            "[ERROR] Camera access denied: "
            +
            error.message
        );


        alert(
            "Please allow camera permission for TiTaN."
        );

    }

}



/* STOP CAMERA */

function stopCamera(){

    if(timer){

        clearInterval(timer);

        timer=null;

    }


    if(stream){

        stream
        .getTracks()
        .forEach(
            track=>
                track.stop()
        );

    }


    stream=null;


    $("preview").srcObject=null;


    $("cam").textContent=
        "OFFLINE";


    $("state").textContent=
        "● DISCONNECTED";


    $("state").className=
        "status";


    log(
        "[CAM] Camera stopped."
    );

}



/* SEND FRAME TO TiTaN */

async function sendFrame(){

    if(
        !stream ||
        $("preview").readyState<2
    ){

        return;

    }


    const video=
        $("preview");


    const canvas=
        $("canvas");


    canvas.width=640;


    canvas.height=
        Math.round(
            640 *
            video.videoHeight /
            video.videoWidth
        ) || 480;


    canvas
    .getContext("2d")
    .drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    canvas.toBlob(

        async blob=>{

            if(!blob)
                return;


            try{

                await fetch(
                    "/api/video_feed",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                            "image/jpeg"
                        },

                        body:blob

                    }
                );

            }catch(error){}

        },

        "image/jpeg",

        .72

    );

}



/* HEARTBEAT */

async function heartbeat(){

    try{

        await fetch(

            "/api/phone/heartbeat",

            {

                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:JSON.stringify({

                    camera:
                        !!stream

                })

            }

        );


        $("server").textContent=
            "ONLINE";


    }catch(error){

        $("server").textContent=
            "OFFLINE";

    }

}


setInterval(
    heartbeat,
    2000
);


heartbeat();


/* CLEANUP */

window.addEventListener(
    "beforeunload",
    stopCamera
);

</script>


</body>

</html>
